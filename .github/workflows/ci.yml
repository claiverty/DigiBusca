name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unitários e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}
      VITE_META_APP_ID: '1787786145843784'
      VITE_WHATSAPP_GRAPH_API_VERSION: 'v25.0'
      VITE_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${{ vars.WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar vulnerabilidades críticas
        run: npm audit --audit-level=high

      - name: Verificar TypeScript dos testes
        run: npx tsc -p tests/tsconfig.json

      - name: Gerar e validar o pacote de produção
        run: npm run deploy:build

      - name: Executar testes unitários compilados
        run: npm run test:compiled

      - name: Guardar o pacote já validado para publicação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: digibusca-production
          path: |
            frontend/dist/
            worker-dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium headless e dependências
        run: npx playwright install chromium --only-shell --with-deps

      - name: Executar a suíte E2E completa em desktop e mobile
        run: npm run test:e2e

  quality:
    name: Build e testes
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Qualidade completa validada
        run: echo "Build, segurança, testes unitários e E2E concluídos."

  backend-image:
    name: Publicar imagem do backend para a VPS
    needs: quality
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o código validado
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/digibusca-backend" >> "$GITHUB_OUTPUT"

      - name: Compilar e publicar imagem imutável do backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=digibusca-backend
          cache-to: type=gha,mode=max,scope=digibusca-backend

      - name: Publicar referência por digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Backend da VPS: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar imagem privada para instalação na VPS
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          image_tag="${IMAGE_NAME}:${GITHUB_SHA}"
          archive="$RUNNER_TEMP/digibusca-backend-image.tar.gz"
          docker pull "$image_tag"
          docker save "$image_tag" | gzip -1 > "$archive"
          gzip -t "$archive"
          printf '%s\n' "$image_tag" > "$RUNNER_TEMP/image-ref.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > image-sha256.txt)

      - name: Guardar imagem privada por 1 dia
        uses: actions/upload-artifact@v4
        with:
          name: digibusca-backend-vps-image
          path: |
            ${{ runner.temp }}/digibusca-backend-image.tar.gz
            ${{ runner.temp }}/image-ref.txt
            ${{ runner.temp }}/image-sha256.txt
          if-no-files-found: error
          retention-days: 1

  deploy-vps-backend:
    name: Atualizar backend na VPS
    needs: [quality, backend-image]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && vars.HOSTGATOR_VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar a imagem validada
        uses: actions/download-artifact@v4
        with:
          name: digibusca-backend-vps-image
          path: ${{ runner.temp }}/digibusca-backend

      - name: Validar o artefato
        working-directory: ${{ runner.temp }}/digibusca-backend
        run: sha256sum -c image-sha256.txt

      - name: Preparar acesso SSH restrito
        env:
          VPS_DEPLOY_KEY: ${{ secrets.HOSTGATOR_VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.HOSTGATOR_VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_DEPLOY_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo '::error::Configure HOSTGATOR_VPS_DEPLOY_KEY e HOSTGATOR_VPS_KNOWN_HOSTS.'
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$HOME/.ssh/digibusca-deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/digibusca-deploy" "$HOME/.ssh/known_hosts"

      - name: Enviar e ativar a imagem na VPS
        env:
          VPS_DEPLOY_HOST: 143.95.213.60
          VPS_DEPLOY_PORT: '22022'
        working-directory: ${{ runner.temp }}/digibusca-backend
        run: |
          image_ref="$(cat image-ref.txt)"
          expected_sha="$(awk 'NR == 1 { print $1 }' image-sha256.txt)"
          {
            printf '%s\n%s\n' "$image_ref" "$expected_sha"
            cat digibusca-backend-image.tar.gz
          } | ssh -p "$VPS_DEPLOY_PORT" \
            -i "$HOME/.ssh/digibusca-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "root@$VPS_DEPLOY_HOST"

  evolution-image:
    name: Publicar imagem Evolution fixada para a VPS
    needs: quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      (contains(toJSON(github.event.commits), 'evolution/patches/') ||
      contains(toJSON(github.event.commits), 'scripts/build-evolution-candidate.sh'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o código validado
        uses: actions/checkout@v7

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome da imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/digibusca-evolution-api" >> "$GITHUB_OUTPUT"

      - name: Compilar e publicar a Evolution com revisão fixada
        env:
          EVOLUTION_CANDIDATE_IMAGE_TAG: ${{ steps.image.outputs.name }}:${{ github.sha }}
          EVOLUTION_CANDIDATE_PUSH: 'true'
        run: sh scripts/build-evolution-candidate.sh

      - name: Publicar referência por digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE_NAME}:${IMAGE_TAG}" | sed -n 's/.*@/@/p' | head -n 1)
          if [ -z "$digest" ]; then
            echo 'Não foi possível obter o digest da imagem Evolution publicada.' >&2
            exit 1
          fi
          echo "Evolution VPS: \`${IMAGE_NAME}${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar imagem privada para instalação na VPS
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          image_tag="${IMAGE_NAME}:${GITHUB_SHA}"
          archive="$RUNNER_TEMP/digibusca-evolution-image.tar.gz"
          docker save "$image_tag" | gzip -1 > "$archive"
          gzip -t "$archive"
          printf '%s\n' "$image_tag" > "$RUNNER_TEMP/image-ref.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > image-sha256.txt)

      - name: Guardar imagem privada por 1 dia
        uses: actions/upload-artifact@v4
        with:
          name: digibusca-evolution-vps-image
          path: |
            ${{ runner.temp }}/digibusca-evolution-image.tar.gz
            ${{ runner.temp }}/image-ref.txt
            ${{ runner.temp }}/image-sha256.txt
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publicar na Cloudflare
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://digibusca.claiverty.workers.dev' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://digibusca.claiverty.workers.dev' }}

    steps:
      - name: Baixar o código aprovado pelo CI
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validar credenciais de produção
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret obrigatório não configurado: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Instalar dependências do publicador
        run: npm ci

      - name: Baixar o pacote já aprovado
        uses: actions/download-artifact@v4
        with:
          name: digibusca-production
          path: .

      - name: Publicar Worker e frontend
        run: npx wrangler deploy

      - name: Validar ambiente publicado
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.PRODUCTION_URL;
          const expectedSha = process.env.GITHUB_SHA;
          if (!baseUrl || !expectedSha) {
            throw new Error('Production validation configuration is missing.');
          }

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function getJson(path, maxAttempts = 5) {
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                const response = await fetch(new URL(path, baseUrl), {
                  headers: { accept: 'application/json' },
                  signal: AbortSignal.timeout(15_000),
                });
                const contentType = response.headers.get('content-type')
                  ?.split(';', 1)[0].trim().toLowerCase();
                const body = await response.text();
                if (!response.ok || contentType !== 'application/json') throw new Error();
                return JSON.parse(body);
              } catch {
                if (attempt === maxAttempts) throw new Error(`Production endpoint validation failed: ${path}`);
                await sleep(3_000 * attempt);
              }
            }
          }

          const health = await getJson('/api/health');
          if (health.status !== 'ok' || health.service !== 'digibusca-backend') {
            throw new Error('Production health response did not match the expected service.');
          }

          let versionMatches = false;
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const appVersion = await getJson(`/app-version.json?check=${Date.now()}-${attempt}`, 1);
              if (appVersion.version === expectedSha) {
                versionMatches = true;
                break;
              }
            } catch {
              // Retry while the Cloudflare deployment propagates.
            }
            if (attempt < 10) await sleep(5_000);
          }
          if (!versionMatches) {
            throw new Error('Published app version validation failed.');
          }

          console.log('Production health and app version validated.');
          NODE
