name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unitários e segurança
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar vulnerabilidades críticas
        run: npm audit --audit-level=high

      - name: Verificar TypeScript dos testes
        run: npx tsc -p tests/tsconfig.json

      - name: Gerar e validar o pacote de produção
        run: npm run deploy:build

      - name: Executar testes unitários compilados
        run: npm run test:compiled

      - name: Guardar o pacote já validado para publicação
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: digibusca-production
          path: |
            frontend/dist/
            worker-dist/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-public-tests-placeholder' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium headless e dependências
        run: npx playwright install chromium --only-shell --with-deps

      - name: Executar a suíte E2E completa em desktop e mobile
        run: npm run test:e2e

  quality:
    name: Build e testes
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Qualidade completa validada
        run: echo "Build, segurança, testes unitários e E2E concluídos."

  deploy:
    name: Publicar na Cloudflare
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://digibusca.claiverty.workers.dev' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://digibusca.claiverty.workers.dev' }}

    steps:
      - name: Baixar o código aprovado pelo CI
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validar credenciais de produção
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret obrigatório não configurado: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Instalar dependências do publicador
        run: npm ci

      - name: Baixar o pacote já aprovado
        uses: actions/download-artifact@v4
        with:
          name: digibusca-production
          path: .

      - name: Publicar Worker e frontend
        run: npx wrangler deploy

      - name: Validar ambiente publicado
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 "$PRODUCTION_URL/api/health"
