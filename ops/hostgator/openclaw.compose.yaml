name: digibusca-hostgator

services:
  # Merge this file with compose.yaml only during the staged OpenClaw migration.
  openclaw-gateway:
    profiles: ["openclaw"]
    image: ${OPENCLAW_IMAGE:?Set the versioned local OpenClaw image tag}
    pull_policy: never
    build:
      context: .
      dockerfile: openclaw-audio.Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_BASE_IMAGE:?Pin the upstream OpenClaw image by digest}
    restart: unless-stopped
    init: true
    env_file:
      - /etc/digibusca/hostgator/openclaw.env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_DISABLE_BONJOUR: "1"
      NODE_OPTIONS: --max-old-space-size=640
      TZ: America/Sao_Paulo
    volumes:
      - openclaw_state:/home/node/.openclaw
      - openclaw_auth_profiles:/home/node/.config/openclaw
      - ./openclaw-workspace/extensions/digibusca-sync:/home/node/.openclaw/extensions/digibusca-sync:ro
    networks:
      openclaw_agent: {}
      openclaw_egress: {}
      openclaw_ui:
        ipv4_address: 10.0.12.5
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
      - /home/node/.cache:size=128m,uid=1000,gid=1000,mode=0700
    pids_limit: 256
    mem_limit: 1024m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  openclaw-panel-auth:
    profiles: ["openclaw"]
    image: ${OPENCLAW_PANEL_PROXY_IMAGE:?Pin the official Caddy image by immutable digest}
    pull_policy: always
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.10
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
      - /data:size=8m,noexec,nosuid,nodev
      - /config:size=8m,noexec,nosuid,nodev
    env_file:
      - path: /etc/digibusca/hostgator/openclaw-panel.env
        format: raw
    volumes:
      - ./openclaw-panel.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      openclaw_ui:
        ipv4_address: 10.0.12.2

networks:
  openclaw_egress:
    name: digibusca-openclaw-egress
    driver: bridge

volumes:
  openclaw_state:
    name: digibusca-hostgator-openclaw-state
    external: true
  openclaw_auth_profiles:
    name: digibusca-hostgator-openclaw-auth
    external: true
