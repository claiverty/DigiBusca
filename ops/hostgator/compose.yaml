name: digibusca-hostgator

services:
  digibusca-backend:
    image: ${DIGIBUSCA_BACKEND_IMAGE:?Set an immutable DIGIBUSCA_BACKEND_IMAGE in Dokploy}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    env_file:
      - /etc/digibusca/hostgator/backend.env
      - /etc/digibusca/hostgator/openclaw-backend.env
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
    networks:
      - backend_origin
      - evolution_app
      - whatsapp_agent
      - openclaw_agent
      - backend_egress
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128

  evolution-db:
    profiles: ["evolution"]
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - /etc/digibusca/hostgator/evolution-db.env
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    volumes:
      - evolution_database:/var/lib/postgresql/data
    networks:
      - evolution_database
    mem_limit: 320m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  evolution-api:
    profiles: ["evolution"]
    image: ${DIGIBUSCA_EVOLUTION_IMAGE:?Set a reviewed DIGIBUSCA_EVOLUTION_IMAGE digest}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - /etc/digibusca/hostgator/evolution-api.env
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    environment:
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_CLIENT_NAME: digibusca
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
    depends_on:
      evolution-db:
        condition: service_healthy
      digibusca-backend:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_app
      - evolution_database
      - evolution_egress
    mem_limit: 700m
    cpus: 0.75
    pids_limit: 256

  cloudflared:
    profiles: ["tunnel"]
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.11.1}
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.10
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - --no-autoupdate
      - run
    secrets:
      - cloudflare_tunnel_credentials
    volumes:
      - type: bind
        source: /opt/digibusca/ops/hostgator/cloudflared.config.example.yml
        target: /etc/cloudflared/config.yml
        read_only: true
    depends_on:
      digibusca-backend:
        condition: service_healthy
    networks:
      - backend_origin
      - tunnel_egress
      - openclaw_ui

networks:
  backend_origin:
    name: digibusca-backend-origin
    driver: overlay
    attachable: true
    internal: true
  evolution_app:
    name: digibusca-evolution-app-private
    driver: overlay
    attachable: true
    internal: true
  evolution_database:
    name: digibusca-evolution-database-private
    driver: overlay
    attachable: true
    internal: true
  evolution_egress:
    name: digibusca-evolution-egress
    driver: bridge
  tunnel_egress:
    name: digibusca-tunnel-egress
    driver: bridge
  backend_egress:
    name: digibusca-backend-egress
    driver: bridge
  whatsapp_agent:
    name: digibusca-whatsapp-agent
    external: true
  openclaw_agent:
    name: digibusca-openclaw-agent
    driver: overlay
    attachable: true
    internal: true
  openclaw_ui:
    name: digibusca-openclaw-ui
    driver: overlay
    attachable: true
    internal: true
    ipam:
      config:
        - subnet: 10.0.12.0/24
volumes:
  evolution_instances:
    name: digibusca-hostgator-evolution-instances
  evolution_database:
    name: digibusca-hostgator-evolution-database

secrets:
  cloudflare_tunnel_credentials:
    file: /etc/digibusca/hostgator/cloudflare-tunnel-credentials.json
